[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nasa-hirise-anomaly-investigation"
version = "1.4.21"
description = "Automated detection, adjudication, and public dossier of anomalous structures in NASA HiRISE imagery of Mars."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nortaq PlayNexus" }]
keywords = ["mars", "hirise", "anomaly", "remote-sensing", "computer-vision"]
dependencies = [
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
