<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: white;
    overflow: hidden;
  }
  .logo {
    width: 120px;
    height: 120px;
    margin-bottom: 24px;
  }
  .title {
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #e94560, #ff6b6b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .tagline {
    font-size: 22px;
    color: rgba(255,255,255,0.8);
    margin-bottom: 32px;
    font-weight: 300;
  }
  .badges {
    display: flex;
    gap: 12px;
  }
  .badge {
    background: rgba(233, 69, 96, 0.2);
    border: 1px solid rgba(233, 69, 96, 0.5);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    color: #ff6b6b;
  }
  .org {
    position: absolute;
    bottom: 32px;
    font-size: 16px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#e94560"/>
        <stop offset="100%" style="stop-color:#ff6b6b"/>
      </linearGradient>
    </defs>
    <circle cx="100" cy="100" r="80" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="100" cy="100" r="55" fill="none" stroke="#e94560" stroke-width="2" opacity="0.4"/>
    <circle cx="100" cy="100" r="12" fill="#e94560"/>
    <line x1="100" y1="45" x2="100" y2="25" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
    <line x1="145" y1="65" x2="160" y2="50" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
    <line x1="155" y1="100" x2="180" y2="100" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="65" x2="40" y2="50" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="100" x2="20" y2="100" stroke="#ff6b6b" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div class="title">NASA HiRISE Investigation</div>
  <div class="tagline">Exclusive Anomaly Detection Pipeline for Mars & Lunar Imagery</div>
  <div class="badges">
    <span class="badge">Python 3.9+</span>
    <span class="badge">NumPy</span>
    <span class="badge">Pillow</span>
    <span class="badge">EXTRAS-Only</span>
  </div>
  <div class="org">PlayNexus</div>
</body>
</html>
