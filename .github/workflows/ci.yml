name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "ruff==0.11.10" pytest

      - name: Lint with ruff
        run: ruff check scripts/ tests/ pipeline/ bot/ app/

      - name: Restore data for CI (from backup if gitignored)
        shell: python
        run: |
          import pathlib, shutil
          root = pathlib.Path(".")
          conc = root / "data" / "anomalies" / "conclusions"
          if not (conc / "adjudicated.csv").exists():
              candidates = [
                  root / "data" / "_backup_upgrade_20260822_220609" / "conclusions",
                  root / "data" / "_backup_upgrade_20260822_220609",
                  root / "site" / "results",
              ]
              restored = False
              for cand in candidates:
                  if (cand / "adjudicated.csv").exists():
                      print(f"Restoring data/anomalies from {cand}")
                      conc.mkdir(parents=True, exist_ok=True)
                      for f in ["adjudicated.csv", "leads.csv", "SUMMARY.md"]:
                          if (cand / f).exists():
                              shutil.copy2(cand / f, conc / f)
                      ana = conc.parent
                      # evaluated.csv may be in cand_parent/analysis or cand/analysis
                      for eval_cand in [cand.parent / "analysis", cand / "analysis"]:
                          if (eval_cand / "evaluated.csv").exists():
                              (ana / "analysis").mkdir(parents=True, exist_ok=True)
                              shutil.copy2(eval_cand / "evaluated.csv", ana / "analysis" / "evaluated.csv")
                              break
                      restored = True
                      break
              if not restored:
                  print("No backup data found, will skip data-dependent checks")

      - name: Run dossier helper tests
        run: python -m pytest tests/ -q -p no:cacheprovider

      - name: Verify site selftest
        run: python scripts/build_site.py --selftest

      - name: Validate conclusions schema
        run: python scripts/validate_conclusions.py --strict

      - name: Audit strip coverage
        run: python scripts/audit_strips.py

      - name: Build site (smoke)
        run: python scripts/build_site.py
