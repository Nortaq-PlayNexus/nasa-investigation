name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-extras.txt 2>/dev/null || true
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Lint with ruff
        run: |
          ruff check pipeline/ scripts/ app/ bot/

      - name: Run tests
        run: |
          python -m pytest tests/test_pipeline.py -v --timeout=120

      - name: Verify pipeline selftest
        run: |
          python scripts/run_pipeline.py --selftest
