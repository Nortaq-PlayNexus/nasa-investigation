# ── EXTRAS-ONLY POLICY ───────────────────────────────────────────────────
# This investigation is LOCKED to the HiRISE PDS EXTRAS archive.
# Every image MUST come from https://hirise-pds.lpl.arizona.edu/PDS/EXTRAS/
# and MUST be consumed as a complete variant set (B&W vs filtered vs ortho
# vs DTM-shaded) via scripts/download_hirise_extras.py. Single-variant
# fetches are rejected — comparison across renderings of the SAME terrain
# is the debunk path. See docs/EXTRAS.md for the full taxonomy & contract.
#
# All other sources below are DEPRECATED and blocked when --enforce-extras
# is active. They are retained only as documentation of what NOT to use.
extras_policy:
  enforced: true
  base: https://hirise-pds.lpl.arizona.edu/PDS/EXTRAS/
  downloader: scripts/download_hirise_extras.py
  comparator: pipeline/extras_compare.py
  exemplar_dtm: ESP_013948_1410_ESP_013236_1410
  exemplar_dir: DTM/ESP/ORB_013900_013999/ESP_013948_1410_ESP_013236_1410
  require_variant_set: true   # every footprint must ship B&W + filtered siblings
  notes: >
    EXTRAS is the only sanctioned source. A feature that appears in only one
    rendering (e.g. filtered color but not B&W RED) is a processing artifact
    until proven otherwise by cross-variant persistence and an independent
    acquisition at different lighting.

sources:
  hirise_extras:
    base: https://hirise-pds.lpl.arizona.edu/PDS/EXTRAS/
    rdr: /PDS/EXTRAS/RDR/ESP/
    dtm: /PDS/EXTRAS/DTM/ESP/
    anaglyph: /PDS/EXTRAS/ANAGLYPH/
    auth: none
    variants:
      rdr:
        RED: "B&W panchromatic (550-850 nm, single band, least processing, highest fidelity — the baseline)"
        IRB: "Enhanced color (IR + RED + BG, stretched/filtered)"
        MIRB: "Map-projected IRB variant"
        MRGB: "Map-projected RGB variant"
        RGB: "RGB composite"
        COLOR: "Quicklook color composite"
        NOMAP: "Non-map-projected (detector geometry preserved)"
        browse: ".browse.jpg full, .abrowse.jpg binned, .thumb.jpg thumbnail"
      dtm:
        DTEEC: "DTM elevation (areoid, equirectangular, 1 m post)"
        DTFEC: "Figure-of-Merit map (stereo correlation quality, JP2)"
        ORTHO_RED: "Orthorectified B&W (RED, geometrically corrected)"
        ORTHO_IRB: "Orthorectified color (IRB, geometrically corrected)"
        derivatives: ".ab/.br shaded relief, .ca/.cb colorized, .ct contour, .sa/.sb slope, .st stereo, .th thumb"
      comparison_contract: "Every footprint's siblings share the same terrain; B&W RED is the baseline. Filtered/ortho/DTM variants should diverge only photometrically for real terrain."
    notes: >
      Canonically accessed via scripts/download_hirise_extras.py which groups
      siblings into VariantSets (data/raw/mars/hirise_extras/<footprint>/) and
      writes _variant_manifest.json. Compared by pipeline/extras_compare.py.

  # ── DEPRECATED — blocked under EXTRAS-only enforcement ─────────────────
  deprecated_nasa_image_library:
    base: https://images-api.nasa.gov
    search: /search
    params:
      q: "<query>"
      media_type: "image|video|audio"
      page_size: 100
    auth: none
    notes: Search API behind images.nasa.gov. Use --media-type video for video frames.

  nasa_rover_rss:
    base: https://mars.nasa.gov/rss/api/
    endpoint: "?feed=raw_images&category=mars2020&feedtype=json&ver=1.2&num=25&order=sol+desc&search="
    categories: [mars2020, ingenuity]
    auth: none
    notes: Raw Mars 2020 imagery feed (Perseverance + Ingenuity), no key. Use download_rover.py. Curiosity/Opportunity/Spirit fall back to the featured-gallery feed.

  nasa_mars_photos_api:
    base: https://api.nasa.gov/mars-photos/api/v1/rovers
    auth: api_key
    notes: ARCHIVED (404 as of 2026). Do not rely on it; use the raw_images feed above.

  hirise_catalog:
    base: https://hirise-pds.lpl.arizona.edu
    catalog: /catalog/HiRISE_Catalog.json
    pds: /PDS/EDR
    auth: none
    notes: MRO HiRISE 0.25-0.5 m/px products. Catalog approx 60 MB JSON.

  lroc_pds:
    base: https://pds-imaging.jpl.nasa.gov
    volumes: /data/lro/lroc/
    auth: none
    notes: LRO LROC NAC (0.5-2 m/px) and WAC (~100 m/px) EDR/RDR volumes.

  pds_geosciences_lro:
    base: https://pds-geosciences.wustl.edu/missions/lro/
    auth: none
    notes: LRO other instruments (LOLA, Mini-RF, Diviner).

  mars_trek:
    base: https://trek.nasa.gov/mars/
    auth: none
    notes: Interactive basemap, CTX/HiRISE mosaics; useful for geo-locating finds.

  moon_trek:
    base: https://trek.nasa.gov/moon/
    auth: none
    notes: Interactive lunar basemap; geo-locating finds.

  apollo_lpi_panoramas:
    base: https://www.lpi.usra.edu/resources/apollopanoramas/
    auth: none
    notes: Apollo surface 35mm stills and panoramas (High/Medium/Low res).

  apollo_sese:
    base: https://apollo.sese.asu.edu/
    auth: none
    notes: Apollo image archive (orbital + surface).

  project_apollo_archive:
    base: https://www.flickr.com/photos/projectapolloarchive/
    auth: none
    notes: Scans of original Apollo Hasselblad film magazines.

  jaxa_kaguya:
    base: https://data.darts.isas.jaxa.jp/pub/pds3/
    auth: none
    notes: Kaguya (SELENE) TC/MI terrain and multiband imagery.

  # -- hard-to-find archives (downloadable via scripts/download_archive.py) --
  ctx_edr:
    volume: https://pds-imaging.jpl.nasa.gov/data/mro/mro-m-ctx-2-edr-l0-v1.0/
    mode: [browse, edr]
    auth: none
    notes: MRO Context Camera, global 6 m/px coverage of Mars. Browse = small
      JPEGs; EDR .IMG files are multi-GB (use --max-size-mb).

  moc_edr:
    volume: https://pds-imaging.jpl.nasa.gov/data/mgs/mgs-m-moc-2-edr-narrowangle-v1.0/
    mode: [browse, edr]
    auth: none
    notes: MGS MOC narrow-angle 1997-2006, 1.5-12 m/px. Pre-HiRISE archive for
      change detection across eras.

  viking1:
    volume: https://pds-imaging.jpl.nasa.gov/data/viking1/v1-visual-v02/
    mode: [browse, edr]
    auth: none
    notes: Viking Orbiter 1 (1976-80) visual imaging.

  viking2:
    volume: https://pds-imaging.jpl.nasa.gov/data/viking2/v2-visual-v02/
    mode: [browse, edr]
    auth: none
    notes: Viking Orbiter 2 (1976-80) visual imaging.

  lunar_orbiter:
    volume: https://pds-imaging.jpl.nasa.gov/data/lunar_orbiter_5/
    mode: [browse, edr]
    auth: none
    notes: Digitized Lunar Orbiter (1966-67) scans, ~60-90 m/px. Path unverified;
      may have moved. USGS Astrogeology serves georeferenced frames too.

  clementine:
    volume: https://pds-geosciences.wustl.edu/missions/clementine/
    mode: [browse, edr]
    auth: none
    notes: Clementine (1994) UVVIS/NIR/HIRES. Path unverified.

  m3:
    volume: https://pds-geosciences.wustl.edu/missions/chandrayaan-1/
    mode: [browse, edr]
    auth: none
    notes: Moon Mineralogy Mapper hyperspectral cubes (85 bands). Read single
      bands with pipeline/pds.py. Path unverified.

  themis:
    volume: https://pds-imaging.jpl.nasa.gov/data/odyssey/themis/
    mode: [browse, edr]
    auth: none
    notes: Mars Odyssey THEMIS visible + thermal IR (~100 m/px). Thermal
      inertia data is invisible in visible light. Path unverified.

  mex_hrsc:
    volume: https://psa.esa.int/
    mode: [browse, edr]
    auth: none
    notes: Mars Express HRSC stereo (10-20 m/px) via ESA PSA. Search interface,
      not plain listings; fetch via web UI/API and drop products in data/raw.

